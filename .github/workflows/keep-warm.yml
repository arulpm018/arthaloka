# Keep Render free tier warm — ping /healthz tiap ±5 menit supaya
# instance tidak spin-down (spin-down = cold start 30-60 detik).
#
# CARA PAKAI:
#   1. Ganti URL di bawah dengan URL Render kamu (https://<nama>.onrender.com)
#   2. Commit & push — workflow aktif otomatis.
#
# Catatan: cron GitHub best-effort (kadang mundur beberapa menit), dan
# workflow otomatis disabled kalau repo tidak ada aktivitas 60 hari —
# cukup push apa pun sesekali untuk menghidupkannya lagi.
# /healthz publik & ringan: tidak butuh API key, tidak makan kuota AI.

name: Keep Render warm

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {} # tombol "Run workflow" buat tes manual

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping healthz
        env:
          # ↓↓↓ GANTI DENGAN URL RENDER KAMU ↓↓↓
          RENDER_URL: https://GANTI-DENGAN-URL-RENDER-KAMU.onrender.com
        run: |
          echo "Ping ${RENDER_URL}/healthz …"
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 "${RENDER_URL}/healthz")
          echo "HTTP status: ${code}"
          # 200 = warm. Kalau bukan 200, step gagal → kelihatan di tab Actions.
          test "$code" = "200"
